name: Build DANZSTRAIGHT APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Auto-Fix Struktur File & AndroidX
        run: |
          # 1. Bersihkan spasi tak sengaja di nama file/folder akibat keyboard HP
          find . -depth -name "* *" -execdir bash -c 'mv "$1" "${1// /}"' _ {} \; || true

          # 2. Buat gradle.properties wajib untuk library Shizuku (AndroidX)
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

          # 3. Pastikan settings.gradle valid
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DANZSTRAIGHT"
          include ':app'
          EOF

          # 4. Pastikan root build.gradle valid
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 5. Pastikan folder utama tersedia dan pindahkan file jika salah taruh di luar
          mkdir -p app/src/main/java/com/danzstraight/vip
          [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml || true
          [ -f "MainActivity.java" ] && mv MainActivity.java app/src/main/java/com/danzstraight/vip/MainActivity.java || true
          [ -f "OverlayService.java" ] && mv OverlayService.java app/src/main/java/com/danzstraight/vip/OverlayService.java || true

          # 6. Pastikan app/build.gradle valid
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.danzstraight.vip'
              compileSdk 34

              defaultConfig {
                  applicationId "com.danzstraight.vip"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-DIRECT-FF"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'dev.rikka.shizuku:api:13.1.5'
              implementation 'dev.rikka.shizuku:provider:13.1.5'
          }
          EOF

          echo "=== Struktur File Saat Ini ==="
          find app -maxdepth 6

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-VIP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
