name: Build DANZSTRAIGHT APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p app/src/main/java/com/danzstraight/vip
      - run: for f in $(find . -name "*AndroidManifest*"); do [ "$f" != "./app/src/main/AndroidManifest.xml" ] && cp "$f" app/src/main/AndroidManifest.xml || true; done
      - run: for f in $(find . -name "*MainActivity*"); do [ "$f" != "./app/src/main/java/com/danzstraight/vip/MainActivity.java" ] && cp "$f" app/src/main/java/com/danzstraight/vip/MainActivity.java || true; done
      - run: for f in $(find . -name "*OverlayService*"); do [ "$f" != "./app/src/main/java/com/danzstraight/vip/OverlayService.java" ] && cp "$f" app/src/main/java/com/danzstraight/vip/OverlayService.java || true; done
      - run: sed -i 's/package="com.danzstraight.vip"//g' app/src/main/AndroidManifest.xml
      - run: sed -i 's/import rikka.shizuku.ShizukuRemoteProcess;//g' app/src/main/java/com/danzstraight/vip/MainActivity.java
      - run: sed -i 's/ShizukuRemoteProcess/Process/g' app/src/main/java/com/danzstraight/vip/MainActivity.java
      - run: printf "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n" > gradle.properties
      - run: printf "pluginManagement {\n repositories {\n google()\n mavenCentral()\n gradlePluginPortal()\n }\n}\ndependencyResolutionManagement {\n repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories {\n google()\n mavenCentral()\n }\n}\nrootProject.name = 'DANZSTRAIGHT'\ninclude ':app'\n" > settings.gradle
      - run: printf "plugins {\n id 'com.android.application' version '8.2.2' apply false\n}\n" > build.gradle
      - run: printf "plugins {\n id 'com.android.application'\n}\nandroid {\n namespace 'com.danzstraight.vip'\n compileSdk 34\n defaultConfig {\n applicationId 'com.danzstraight.vip'\n minSdk 26\n targetSdk 34\n versionCode 3\n versionName '3.0-DIRECT-FF'\n }\n compileOptions {\n sourceCompatibility JavaVersion.VERSION_17\n targetCompatibility JavaVersion.VERSION_17\n }\n}\ndependencies {\n implementation 'dev.rikka.shizuku:api:13.1.5'\n implementation 'dev.rikka.shizuku:provider:13.1.5'\n}\n" > app/build.gradle
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DANZSTRAIGHT-VIP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
