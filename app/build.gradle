plugins {
    id 'com.android.application'
}

android {
    namespace 'com.danzstraight.vip'
    compileSdk 34

    defaultConfig {
        applicationId "com.danzstraight.vip"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0-DIRECT-FF"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
